<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>數學學習疑難與有效教學示例｜檢索</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap"
      rel="stylesheet"
    />
    <!--
  file:// 直接開啟時 fetch 會被 CORS 擋，改用以下兩行載入 build_data.py --js 產出的檔案。
  放在 http 伺服器上時保持註解，程式會走 fetch。
  <script src="examples.js"></script>
  <script src="pages.js"></script>
-->

    <style>
      /* =========================================================================
   數學學習疑難與有效教學示例｜檢索
   視覺基準：補強課程模組 共用樣式表 v1（ntnu-modul）
   ========================================================================= */
      :root {
        --paper: #f5f5f3;
        --card: #ffffff;
        --ink: #16181c;
        --ink-soft: #5b6470;
        --line: #dde1e4;
        --line-strong: #c3c9ce;

        --accent: #e2993d;
        --accent-soft: #fbedd6;
        --accent-ink: #8a5c19;
        --link: #1155cc;
        --link-soft: #dce6fa;

        --blue: #3b5fcb;
        --blue-soft: #dee4f7;
        --blue-ink: #2f4fb0;
        --red-soft: #f7dede;
        --red-ink: #a11f1f;
        --slate: #5b6470;
        --slate-soft: #e3e5e7;

        --hit: #f6d9a0;

        --font-serif: "Noto Serif TC", "Songti TC", serif;
        --font-sans:
          "Noto Sans TC", system-ui, "PingFang TC", "Microsoft JhengHei",
          sans-serif;
        --font-mono: "JetBrains Mono", ui-monospace, "Consolas", monospace;

        --radius: 4px;
        --radius-lg: 8px;
        --radius-pill: 999px;

        --shadow: 0 1px 2px rgba(22, 24, 28, 0.04);
        --shadow-lift: 0 6px 18px rgba(22, 24, 28, 0.1);

        --wrap: 1120px;
        --fs-scale: 1; /* 全域基準，維持 1；卡片字級另由 --card-scale 控制 */
        --card-scale: 1; /* 卡片內文字級倍率，只作用於 .card-body */

        /* 相容別名：舊選擇器若有殘留引用不致失色 */
        --ink-2: var(--ink-soft);
        --ink-3: var(--ink-soft);
        --rule: var(--line);
        --rule-2: var(--line);
        --plum: var(--accent-ink);
        --mono: var(--font-mono);
        --sans: var(--font-sans);
      }

      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
      }
      body {
        background: var(--paper);
        color: var(--ink);
        font-family: var(--font-sans);
        font-size: calc(14px * var(--fs-scale));
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
      }
      a {
        color: var(--link);
      }
      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      .wrap {
        max-width: var(--wrap);
        width: 100%;
        margin: 0 auto;
        padding: 26px 20px 60px;
      }

      /* ── 頁首 ───────────────────────────────── */
      header.masthead {
        margin-bottom: 18px;
        padding: 0;
        border: 0;
      }
      .eyebrow {
        font-family: var(--font-mono);
        font-size: 11px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--ink-soft);
        margin: 0 0 6px;
        font-weight: 500;
      }
      h1 {
        font-family: var(--font-serif);
        font-weight: 700;
        font-size: clamp(20px, 3.2vw, 28px);
        letter-spacing: 0.01em;
        margin: 0 0 6px;
        line-height: 1.45;
      }
      .subtitle {
        margin: 0;
        max-width: 66ch;
        font-size: calc(13.5px * var(--fs-scale));
        line-height: 1.7;
        color: var(--ink-soft);
      }

      /* ── 控制列 ─────────────────────────────── */
      .controls {
        position: sticky;
        top: 0;
        z-index: 20;
        background: var(--paper);
        border-bottom: 1px solid var(--line);
        padding: 14px 0 12px;
        margin-bottom: 16px;
      }
      .ctl-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        margin-bottom: 10px;
      }
      .ctl-row:last-child {
        margin-bottom: 0;
      }
      .ctl-label {
        font-family: var(--font-mono);
        font-size: 10.5px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--ink-soft);
        font-weight: 500;
        min-width: 44px;
      }

      .searchbox {
        position: relative;
        flex: 1 1 260px;
        min-width: 220px;
      }
      .searchbox input {
        width: 100%;
        padding: 7px 34px 7px 9px;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: #fff;
        color: var(--ink);
        font-family: var(--font-sans);
        font-size: 13.5px;
      }
      .searchbox input:focus {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
        border-color: var(--line);
      }
      .searchbox button {
        position: absolute;
        right: 4px;
        top: 50%;
        transform: translateY(-50%);
        border: 0;
        background: none;
        color: var(--ink-soft);
        cursor: pointer;
        font-size: 16px;
        line-height: 1;
        padding: 5px 7px;
        border-radius: var(--radius-pill);
      }
      .searchbox button:hover {
        color: var(--ink);
      }

      .chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-family: var(--font-mono);
        font-size: 11.5px;
        letter-spacing: 0.03em;
        padding: 6px 12px;
        line-height: 1.4;
        background: #fff;
        color: var(--ink-soft);
        border: 1px solid var(--line);
        border-radius: var(--radius-pill);
        cursor: pointer;
        transition:
          background 0.15s,
          border-color 0.15s,
          color 0.15s;
      }
      .chip:hover {
        border-color: var(--ink-soft);
        color: var(--ink);
      }
      .chip[aria-pressed="true"] {
        background: var(--ink);
        border-color: var(--ink);
        color: #d35454;
      }
      .chip.theme[aria-pressed="true"] {
        background: var(--ink);
        border-color: var(--ink);
      }

      /* 分段控制群組（搜尋範圍／年級） */
      .tabs {
        display: flex;
        height: fit-content;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        overflow: hidden;
      }
      .tabs .chip {
        border: 0;
        border-radius: 0;
        background: #fff;
        padding: 7px 12px;
      }
      .tabs .chip + .chip {
        border-left: 1px solid var(--line);
      }
      .tabs .chip:not([aria-pressed="true"]):hover {
        background: var(--paper);
      }

      .tally {
        font-family: var(--font-mono);
        font-size: 11.5px;
        color: var(--ink-soft);
        margin-left: auto;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .tally b {
        color: var(--ink);
        font-weight: 700;
      }

      /* ── 卡片 ───────────────────────────────── */
      .card {
        position: relative;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        margin-bottom: 12px;
        display: flex;
        overflow: hidden;
        transition:
          border-color 0.18s,
          box-shadow 0.18s;
      }
      .card:hover {
        border-color: var(--line-strong);
        box-shadow: var(--shadow-lift);
      }
      /* 左緣色條：與模組站 .card::before 同一視覺語彙 */
      .card::before {
        content: "";
        position: absolute;
        left: 0;
        top: 10px;
        bottom: 10px;
        width: 3px;
        background: var(--accent);
        border-radius: 0 2px 2px 0;
        z-index: 1;
      }
      /* 書口索引：原書頁碼區間 */
      .spine {
        flex: 0 0 44px;
        border-right: 1px dashed var(--line);
        background: transparent;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        padding: 14px 0;
        gap: 2px;
        font-family: var(--font-mono);
        font-size: 10px;
        color: var(--ink-soft);
      }
      .spine .pg {
        font-size: 11.5px;
        color: var(--ink);
        font-weight: 500;
      }
      .spine .bar {
        width: 1px;
        flex: 1;
        min-height: 14px;
        background: var(--line);
        margin: 3px 0;
      }
      .card-body {
        flex: 1;
        padding: 14px 16px;
        min-width: 0;
        /* 只在卡片內文改寫 --fs-scale：
           變數會沿著 DOM 往下繼承，因此底下所有用 calc(px * var(--fs-scale))
           的字級一律跟著縮放；頁首、控制列、頁尾仍讀 :root 的 1，不受影響。 */
        --fs-scale: var(--card-scale);
      }

      .card h2 {
        margin: 0;
        font-family: var(--font-serif);
        font-weight: 700;
        font-size: calc(15.5px * var(--fs-scale));
        line-height: 1.45;
      }
      .byline {
        margin: 3px 0 10px;
        font-size: calc(12.5px * var(--fs-scale));
        line-height: 1.75;
        color: var(--ink-soft);
      }
      .tagrow {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-bottom: 10px;
      }
      .tag {
        font-family: var(--font-mono);
        font-size: calc(10.5px * var(--fs-scale));
        letter-spacing: 0.03em;
        padding: 3px 8px;
        border-radius: var(--radius-pill);
        white-space: nowrap;
        border: 0;
        background: var(--slate-soft);
        color: var(--slate);
      }
      .tag.grade {
        background: var(--blue-soft);
        color: var(--blue-ink);
        font-weight: 500;
      }
      .tag.theme {
        background: var(--link-soft);
        color: var(--link);
      }

      /* 導言 */
      .intro {
        margin: 0 0 12px;
        font-size: calc(12.5px * var(--fs-scale));
        line-height: 1.85;
        color: var(--ink-soft);
        padding-left: 11px;
        border-left: 3px solid var(--accent-soft);
      }

      /* 指標區 */
      .ind {
        border-top: 1px solid var(--line);
        padding-top: 10px;
        margin-top: 2px;
      }
      .ind-line {
        display: flex;
        gap: 9px;
        margin-bottom: 7px;
        align-items: flex-start;
      }
      .ind-kind {
        flex: 0 0 74px;
        font-family: var(--font-mono);
        font-size: calc(10.5px * var(--fs-scale));
        letter-spacing: 0.04em;
        color: var(--ink-soft);
        padding-top: 3px;
      }
      .ind-text {
        flex: 1;
        font-size: calc(12.5px * var(--fs-scale));
        color: var(--ink-soft);
        line-height: 1.75;
        min-width: 0;
      }
      code.code {
        font-family: var(--font-mono);
        font-size: calc(10.5px * var(--fs-scale));
        letter-spacing: 0.02em;
        background: var(--link-soft);
        color: var(--link);
        padding: 2px 7px;
        border-radius: var(--radius-pill);
        margin-right: 5px;
        white-space: nowrap;
      }
      code.code.v105 {
        background: var(--accent-soft);
        color: var(--accent-ink);
      }
      .ver {
        font-family: var(--font-mono);
        font-size: calc(10px * var(--fs-scale));
        color: var(--ink-soft);
        margin-left: 4px;
      }

      /* 展開區 */
      .more {
        border-top: 1px dashed var(--line);
        margin-top: 12px;
        padding-top: 10px;
        display: none;
      }
      .card.open .more {
        display: block;
      }
      .sec {
        margin-bottom: 14px;
      }
      .sec:last-child {
        margin-bottom: 0;
      }
      .sec h3 {
        margin: 0 0 5px;
        font-family: var(--font-mono);
        font-size: calc(10.5px * var(--fs-scale));
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--ink);
        font-weight: 500;
      }
      .sec ol,
      .sec ul {
        margin: 0;
        padding-left: 16px;
        font-size: calc(12.5px * var(--fs-scale));
        line-height: 1.75;
        color: var(--ink-soft);
      }
      .sec li {
        margin-bottom: 3px;
      }
      .src {
        font-family: var(--font-mono);
        font-size: calc(10px * var(--fs-scale));
        color: var(--ink-soft);
        margin-left: 5px;
      }
      .mis li::marker {
        color: var(--accent-ink);
        font-weight: 700;
      }

      /* 全文命中 */
      .hits {
        border-top: 1px dashed var(--line);
        margin-top: 12px;
        padding-top: 10px;
      }
      .hits h3 {
        font-family: var(--font-mono);
        font-size: calc(10.5px * var(--fs-scale));
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--ink);
        font-weight: 500;
      }
      .hit {
        display: flex;
        gap: 9px;
        margin-bottom: 5px;
        align-items: flex-start;
        padding: 8px 10px;
        background: var(--accent-soft);
        border-radius: var(--radius);
        font-size: calc(12px * var(--fs-scale));
      }
      .hit .p {
        flex: 0 0 38px;
        font-family: var(--font-mono);
        font-size: calc(10.5px * var(--fs-scale));
        letter-spacing: 0.03em;
        color: var(--accent-ink);
        padding-top: 2px;
        text-align: right;
      }
      .hit .t {
        flex: 1;
        color: var(--ink);
        line-height: 1.7;
        min-width: 0;
      }
      .hit .t.src {
        color: var(--ink-soft);
      }

      mark {
        background: var(--hit);
        color: var(--ink);
        padding: 0 1px;
        border-radius: 2px;
      }

      /* ── 操作按鈕 ───────────────────────────── */
      .actions {
        margin-top: 12px;
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        align-items: center;
      }
      .btn {
        font-family: var(--font-mono);
        font-size: calc(10.5px * var(--fs-scale));
        letter-spacing: 0.02em;
        padding: 4px 9px;
        line-height: 1.6;
        background: #fff;
        color: var(--ink-soft);
        border: 1px solid var(--line);
        border-radius: var(--radius-pill);
        cursor: pointer;
        text-decoration: none;
        display: inline-block;
      }
      .btn:hover {
        border-color: var(--ink);
        color: var(--ink);
      }
      /* 另開新視窗的連結一律琥珀 pill，與模組站 .pdf-link 一致 */
      a.btn {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 4px 11px;
        background: var(--accent-soft);
        color: var(--accent-ink);
        border-color: var(--accent);
      }
      a.btn::before {
        content: "↗";
        font-size: calc(11px * var(--fs-scale));
        line-height: 1;
      }
      a.btn:hover {
        background: var(--accent);
        color: #fff;
        border-color: var(--accent);
      }
      button.btn[aria-expanded="true"] {
        background: var(--ink);
        color: #fff;
        border-color: var(--ink);
      }

      /* ── 空狀態與錯誤 ───────────────────────── */
      .msg {
        padding: 40px 20px;
        color: var(--ink-soft);
        font-size: 13.5px;
        text-align: center;
        border: 1px dashed var(--line);
        border-radius: var(--radius);
        background: transparent;
      }
      .msg b {
        display: block;
        color: var(--ink);
        font-size: 14.5px;
        margin-bottom: 6px;
        font-family: var(--font-serif);
      }
      .msg code {
        font-family: var(--font-mono);
        font-size: 12px;
        background: var(--slate-soft);
        padding: 1px 5px;
        border-radius: 2px;
      }
      .err {
        border-color: var(--red-ink);
        background: var(--red-soft);
      }
      .err b {
        color: var(--red-ink);
      }

      footer {
        margin-top: 30px;
        padding-top: 14px;
        border-top: 1px solid var(--line);
        font-family: var(--font-mono);
        font-size: 11.5px;
        line-height: 1.7;
        color: var(--ink-soft);
        font-variant-numeric: tabular-nums;
      }

      @media (max-width: 640px) {
        .wrap {
          padding: 20px 14px 40px;
        }
        .spine {
          flex-basis: 34px;
        }
        .card-body {
          padding: 12px 14px;
        }
        .ind-kind {
          flex-basis: 62px;
        }
        .ctl-label {
          display: none;
        }
        .tally {
          width: 100%;
          margin-left: 0;
        }
        .tabs {
          width: 100%;
        }
        .tabs .chip {
          flex: 1;
          justify-content: center;
        }
      }
      @media (max-width: 380px) {
        .card::before {
          top: 8px;
          bottom: 8px;
        }
        .card h2 {
          font-size: calc(14px * var(--fs-scale));
        }
        .tag,
        .spine {
          font-size: 10px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header class="masthead">
        <p class="eyebrow">國小中年級低成就學生</p>
        <h1>數學學習疑難與有效教學示例</h1>
        <p class="subtitle">依年級、主題、課綱指標或迷思概念查找示例。</p>
      </header>

      <div class="controls">
        <div class="ctl-row">
          <span class="ctl-label">搜尋</span>
          <div class="searchbox">
            <input
              id="q"
              type="search"
              autocomplete="off"
              spellcheck="false"
              placeholder="輸入關鍵字，例如：等值分數、先乘除後加減、S-4-6"
            />
            <button id="clear" type="button" title="清除" aria-label="清除搜尋">
              ×
            </button>
          </div>
          <div class="tabs" id="scope" role="group" aria-label="搜尋範圍"></div>
        </div>

        <div class="ctl-row">
          <span class="ctl-label">年級</span>
          <div class="tabs" id="grades" role="group" aria-label="年級"></div>
          <span class="ctl-label" style="margin-left: 8px">主題</span>
          <div
            id="themes"
            style="display: flex; gap: 6px; flex-wrap: wrap"
          ></div>
          <span class="tally" id="tally"></span>
          <span class="ctl-label" style="min-width: auto">字級</span>
          <div class="tabs" id="fontsize" role="group" aria-label="卡片字級">
            <button
              class="chip"
              type="button"
              data-scale="0.9"
              aria-pressed="false"
            >
              小
            </button>
            <button
              class="chip"
              type="button"
              data-scale="1"
              aria-pressed="true"
            >
              中
            </button>
            <button
              class="chip"
              type="button"
              data-scale="1.15"
              aria-pressed="false"
            >
              大
            </button>
          </div>
        </div>
      </div>

      <main id="list"></main>

      <footer id="foot"></footer>
    </div>

    <script>
      "use strict";

      /* ══ 狀態 ══════════════════════════════════════════ */
      const S = {
        examples: [], // examples.json 的 examples 陣列
        meta: {},
        pages: null, // pages.json，延遲載入
        pagesLoading: false,
        q: "",
        grade: 0, // 0 = 全部
        themes: new Set(), // 空 = 全部
        scope: "all", // all | curr | mis | full
        open: new Set(), // 已展開的示例 id
      };

      const SCOPES = [
        ["all", "全部"],
        ["curr", "指標"],
        ["mis", "迷思概念"],
        ["full", "全文"],
      ];
      const THEME_LIST = [
        "數與計算",
        "量與實測",
        "空間與形狀",
        "關係",
        "資料與不確定性",
      ];
      const GRADE_NAME = { 3: "三年級", 4: "四年級" };

      /* ══ 正規化 ════════════════════════════════════════
   中文檢索不斷詞：把全形轉半形、去掉所有空白、轉小寫之後直接 indexOf。
   同時產生位置對照表 map，map[i] = 正規化字串第 i 字在原文的索引，
   命中後可換算回原文位置，標示不會偏移。                            */
      function normalize(s) {
        const out = [],
          map = [];
        for (let i = 0; i < s.length; i++) {
          let ch = s[i];
          const c = s.charCodeAt(i);
          if (c === 0x3000) continue; // 全形空白
          if (c >= 0xff01 && c <= 0xff5e) ch = String.fromCharCode(c - 0xfee0);
          if (/\s/.test(ch)) continue; // 半形空白與換行
          out.push(ch.toLowerCase());
          map.push(i);
        }
        return { n: out.join(""), map: map };
      }

      /** 只要正規化後的字串，用於建 haystack（不需要位置） */
      function norm(s) {
        return normalize(s).n;
      }

      /** 在原文 text 中標示所有 q 的出現處，回傳已跳脫的 HTML */
      function mark(text, q) {
        if (!q) return esc(text);
        const { n, map } = normalize(text);
        const nq = norm(q);
        if (!nq) return esc(text);

        const spans = [];
        let from = 0,
          idx;
        while ((idx = n.indexOf(nq, from)) !== -1) {
          spans.push([map[idx], map[idx + nq.length - 1] + 1]); // 換算回原文區間
          from = idx + nq.length;
        }
        if (!spans.length) return esc(text);

        let html = "",
          cur = 0;
        for (const [a, b] of spans) {
          html +=
            esc(text.slice(cur, a)) +
            "<mark>" +
            esc(text.slice(a, b)) +
            "</mark>";
          cur = b;
        }
        return html + esc(text.slice(cur));
      }

      function esc(s) {
        return String(s).replace(
          /[&<>"]/g,
          (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c],
        );
      }

      /* ══ haystack 分層 ═════════════════════════════════
   三層隨 examples.json 一起進記憶體，全文層留在 pages.json 延遲載入。
   結果快取在示例物件的 _hay 上，只算一次。                          */
      function hay(rec) {
        if (rec._hay) return rec._hay;
        const c = rec.curriculum || {};
        const allInd = [].concat(
          c.learning_content || [],
          c.learning_performance || [],
          c.basic_content || [],
          c.basic_performance || [],
        );

        const meta = [
          rec.title,
          rec.introduction || "",
          (rec.keywords || []).join(" "),
          (rec.themes || []).join(" "),
          (rec.materials || []).join(" "),
          rec.author
            ? [rec.author.name, rec.author.title, rec.author.school].join(" ")
            : "",
          (rec.grade || []).map((g) => GRADE_NAME[g] || "").join(" "),
        ].join(" ");

        const curr = allInd
          .map((x) =>
            [x.code, x.alias_in_source, x.source_text]
              .filter(Boolean)
              .join(" "),
          )
          .join(" ");

        const mis = []
          .concat(
            (rec.misconceptions || []).map((m) => m.text),
            (rec.strategies || []).map((s) => s.title),
          )
          .join(" ");

        rec._hay = { meta: norm(meta), curr: norm(curr), mis: norm(mis) };
        return rec._hay;
      }

      /* ══ 資料載入 ══════════════════════════════════════ */
      // 資料檔與 PDF 皆在 Firebase Storage，與前端不同源，
      // 靠 bucket 的 CORS 設定（origin: ["*"]）放行。
      const FB_BASE =
        "https://firebasestorage.googleapis.com/v0/b/upload-2a184.appspot.com/o/";
      const JSON_DIR = "m34"; // JSON 在 Storage 的虛擬目錄
      const PDF_BASE = FB_BASE; // pdf.path 已含 "pdfs/" 前綴，不另加目錄

      /** 組出 Storage 的無 token 下載 URL。
    路徑分隔符必須編成 %2F，否則端點會解讀為 REST 路徑層級而非物件名稱，
    故用 encodeURIComponent（不保留斜線）而非 encodeURI。 */
      function fbUrl(path, bust) {
        const u = FB_BASE + encodeURIComponent(path) + "?alt=media";
        return bust ? u + "&v=" + Date.now() : u;
      }

      /** 先看 build_data.py --js 塞進 window 的全域變數，沒有才 fetch。
    Storage 對未指定 Cache-Control 的物件回 max-age=3600，
    而 Console 上傳無法設定該標頭，故改以 query 破壞快取。
    原本的 cache:"no-cache" 只作用於瀏覽器快取，對此無效，已移除。 */
      async function loadData(name, globalKey) {
        if (window[globalKey]) return window[globalKey];
        const res = await fetch(fbUrl(JSON_DIR + "/" + name, true));
        if (!res.ok) throw new Error(name + " 回應 " + res.status);
        return res.json();
      }

      /** 全文層延遲載入：僅在 scope 涵蓋全文且已有關鍵字時觸發。
    pagesLoading 兼作重入鎖，避免 debounce 期間連續輸入重複發請求。
    失敗時把 S.pages 設為空物件而非留 null，否則每次輸入都會重打一次。 */
      async function ensurePages() {
        if (S.pages || S.pagesLoading) return;
        S.pagesLoading = true;
        render(); // 讓 tally 顯示「載入全文中…」
        try {
          const data = await loadData("pages.json", "__PAGES__");
          S.pages = data.pages || data; // 見下方待確認事項
        } catch (e) {
          console.error("pages.json 載入失敗", e);
          S.pages = {};
        } finally {
          S.pagesLoading = false;
          render();
        }
      }
      /* ══ 連結解析 ══════════════════════════════════════ */
      // 依序嘗試「學校短網址 → Firebase 短網址 → 學校直連 → Firebase 直連」。
      //
      // 關鍵設計：探測目標與開啟目標分離。短網址本身不探測——對 supr.link 發出
      // 探測請求會被記為一次點擊，加上實際開啟就是重複計點，統計值會系統性偏高。
      // 改為探測該層對應的直連網址，可用性判斷等價，且不影響點擊統計。
      const LINK_CHAIN = [
        { open: "school_html", probe: "school_direct" },
        { open: "firebase_pdf", probe: "firebase_direct" },
        { open: "school_direct", probe: "school_direct" },
        { open: "firebase_direct", probe: "firebase_direct" },
      ];

      const linkHealth = new Map(); // url -> boolean，同一 session 每個網址只探測一次

      /** mode:"no-cors" 取得 opaque response，只在網路層失敗時 reject。
    因此本函式偵測的是「主機是否回應」而非「檔案是否存在」，404 會被判為可達。
    學校空間不開放 CORS，無法讀取 status，此為設計上的取捨。 */
      async function probeReachable(url, timeoutMs = 1500) {
        if (linkHealth.has(url)) return linkHealth.get(url);
        let ok = false;
        try {
          await fetch(url, {
            mode: "no-cors",
            signal: AbortSignal.timeout(timeoutMs),
          });
          ok = true;
        } catch (e) {
          ok = false;
        }
        linkHealth.set(url, ok);
        return ok;
      }

      const linkOf = (links, label) =>
        (links || []).find((l) => l.label === label) || null;

      /** 回傳第一個「探測目標可達」的候選之開啟網址；全數不可達則回 null。 */
      async function resolveLink(links) {
        for (const step of LINK_CHAIN) {
          const open = linkOf(links, step.open);
          const probe = linkOf(links, step.probe);
          if (!open || !probe) continue; // 短網址未填時該層跳過
          if (await probeReachable(probe.url)) return open.url;
        }
        return null;
      }

      /** 預設 href，供右鍵複製與中鍵開新分頁使用（這兩種操作不觸發下方委派）。 */
      function primaryLink(links) {
        for (const step of LINK_CHAIN) {
          const open = linkOf(links, step.open);
          if (open) return open.url;
        }
        return "#";
      }

      /** 事件委派：綁在 document 上，不需與 render() 整合，重繪後仍有效。 */
      function installLinkDelegation() {
        document.addEventListener("click", async (e) => {
          const a = e.target.closest("a[data-ex]");
          if (!a) return;
          if (
            e.defaultPrevented ||
            e.button !== 0 ||
            e.metaKey ||
            e.ctrlKey ||
            e.shiftKey ||
            e.altKey
          )
            return;

          const rec = S.examples.find((x) => x.id === a.dataset.ex);
          if (!rec || !rec.links) return; // 無 links 時退回 href 原生行為

          e.preventDefault();
          const url = await resolveLink(rec.links);
          if (url) window.open(url, "_blank", "noopener");
          else
            alert(
              "學校空間、Firebase 與短網址服務目前都無法連線，請稍後再試。",
            );
        });
      }
      /* ══ 篩選與比對 ════════════════════════════════════ */
      function needFull() {
        return S.scope === "all" || S.scope === "full";
      }

      /** 回傳該示例的全文命中：[{p, t, i}]，i 為原文中的命中位置 */
      function fullHits(rec, nq) {
        if (!nq || !S.pages) return [];
        const pages = S.pages[rec.id] || [];
        const out = [];
        for (const pg of pages) {
          const { n, map } = normalize(pg.t);
          const idx = n.indexOf(nq);
          if (idx !== -1) out.push({ p: pg.p, t: pg.t, i: map[idx] });
        }
        return out;
      }

      /** 主篩選：年級 → 主題 → 關鍵字（依 scope 決定比對哪幾層） */
      function filter() {
        const nq = norm(S.q);
        const rows = [];

        for (const rec of S.examples) {
          if (S.grade && !(rec.grade || []).includes(S.grade)) continue;
          if (S.themes.size && !(rec.themes || []).some((t) => S.themes.has(t)))
            continue;

          if (!nq) {
            rows.push({ rec, hits: [] });
            continue;
          }

          const h = hay(rec);
          let ok = false;
          if (S.scope === "all")
            ok =
              h.meta.includes(nq) || h.curr.includes(nq) || h.mis.includes(nq);
          else if (S.scope === "curr") ok = h.curr.includes(nq);
          else if (S.scope === "mis") ok = h.mis.includes(nq);

          const hits = needFull() ? fullHits(rec, nq) : [];
          if (ok || hits.length) rows.push({ rec, hits });
        }
        return rows;
      }

      /* ══ 渲染 ══════════════════════════════════════════ */
      function indLine(kind, items, cls) {
        if (!items || !items.length) return "";
        const body = items
          .map((x) => {
            const v105 = x.version === "105" || /^\d-[a-z]/.test(x.code || "");
            return (
              "<div>" +
              '<code class="code' +
              (v105 ? " v105" : "") +
              '">' +
              esc(x.code || "") +
              "</code>" +
              (x.version
                ? '<span class="ver">' + esc(x.version) + " 年版</span>"
                : "") +
              (x.alias_in_source
                ? '<span class="ver">同 ' + esc(x.alias_in_source) + "</span>"
                : "") +
              "<div>" +
              mark(x.source_text || "", S.q) +
              "</div>" +
              "</div>"
            );
          })
          .join("");
        return (
          '<div class="ind-line"><div class="ind-kind">' +
          kind +
          '</div><div class="ind-text ' +
          (cls || "") +
          '">' +
          body +
          "</div></div>"
        );
      }

      function snippet(hit) {
        const R = 55; // 命中位置前後各取 55 字
        const a = Math.max(0, hit.i - R);
        const b = Math.min(hit.t.length, hit.i + R);
        const raw = hit.t.slice(a, b).replace(/\n+/g, " ");
        return (a > 0 ? "…" : "") + raw + (b < hit.t.length ? "…" : "");
      }

      function card(row) {
        const r = row.rec,
          c = r.curriculum || {},
          open = S.open.has(r.id);
        const pgs = (r.pdf && r.pdf.pages) || [];
        const a = r.author || {};

        const tags =
          (r.grade || [])
            .map(
              (g) =>
                '<span class="tag grade">' + (GRADE_NAME[g] || g) + "</span>",
            )
            .join("") +
          (r.themes || [])
            .map((t) => '<span class="tag theme">' + esc(t) + "</span>")
            .join("") +
          (r.low_pass_years && r.low_pass_years.length
            ? '<span class="tag">低通過率 ' +
              r.low_pass_years.join("、") +
              "</span>"
            : "");

        const intro = (r.introduction || "").trim()
          ? '<p class="intro">' + mark(r.introduction, S.q) + "</p>"
          : "";

        // 導論一類的文件沒有課綱指標，整個 .ind 區塊就不輸出，避免留下空的分隔線
        const indBody =
          indLine("學習內容", c.learning_content) +
          indLine("學習表現", c.learning_performance) +
          indLine("基本學習內容", c.basic_content) +
          indLine("基本學習表現", c.basic_performance);
        const ind = indBody ? '<div class="ind">' + indBody + "</div>" : "";

        const mis = (r.misconceptions || []).length
          ? '<div class="sec"><h3>迷思概念（' +
            r.misconceptions.length +
            '）</h3><ol class="mis">' +
            r.misconceptions
              .map(
                (m) =>
                  "<li>" +
                  mark(m.text, S.q) +
                  (m.source
                    ? '<span class="src">' + esc(m.source) + "</span>"
                    : "") +
                  "</li>",
              )
              .join("") +
            "</ol></div>"
          : "";

        const str = (r.strategies || []).length
          ? '<div class="sec"><h3>教學策略</h3><ol>' +
            r.strategies
              .map((s) => "<li>" + mark(s.title, S.q) + "</li>")
              .join("") +
            "</ol></div>"
          : "";

        const mat = (r.materials || []).length
          ? '<div class="sec"><h3>教材教具</h3><ul><li>' +
            r.materials.map((m) => mark(m, S.q)).join("、") +
            "</li></ul></div>"
          : "";

        const links = (r.external_links || []).length
          ? '<div class="sec"><h3>延伸資源</h3><ul>' +
            r.external_links
              .map(
                (l) =>
                  '<li><a class="btn" href="' +
                  esc(l.url) +
                  '" target="_blank" rel="noopener">' +
                  esc(l.label || l.url) +
                  "</a>" +
                  (l.context
                    ? '<span class="src">' + esc(l.context) + "</span>"
                    : "") +
                  "</li>",
              )
              .join("") +
            "</ul></div>"
          : "";

        const assess = (r.assessment_refs || []).length
          ? '<div class="sec"><h3>施測期別</h3><ul><li>' +
            r.assessment_refs.map((x) => esc(x.period || x.raw)).join("、") +
            "</li></ul></div>"
          : "";

        const hits = row.hits.length
          ? '<div class="hits"><h3 class="sec" style="margin:0 0 6px">全文命中 ' +
            row.hits.length +
            " 頁</h3>" +
            row.hits
              .slice(0, 4)
              .map(
                (h) =>
                  '<div class="hit"><div class="p">p.' +
                  h.p +
                  "</div>" +
                  '<div class="t">' +
                  mark(snippet(h), S.q) +
                  "</div></div>",
              )
              .join("") +
            (row.hits.length > 4
              ? '<div class="hit"><div class="p"></div><div class="t src">另有 ' +
                (row.hits.length - 4) +
                " 頁命中</div></div>"
              : "") +
            "</div>"
          : "";

        return (
          '<article class="card' +
          (open ? " open" : "") +
          '" data-id="' +
          r.id +
          '">' +
          '<div class="spine">' +
          (pgs.length
            ? '<span class="pg">' +
              pgs[0] +
              '</span><span class="bar"></span>' +
              '<span class="pg">' +
              pgs[pgs.length - 1] +
              "</span>"
            : '<span class="bar"></span>') +
          "</div>" +
          '<div class="card-body">' +
          "<h2>" +
          mark(r.title || "", S.q) +
          "</h2>" +
          '<p class="byline">' +
          [
            esc([a.school, a.name, a.title].filter(Boolean).join("　")),
            '<span class="src">' + esc(r.id) + "</span>",
          ]
            .filter(Boolean)
            .join("　") +
          "</p>" +
          '<div class="tagrow">' +
          tags +
          "</div>" +
          intro +
          ind +
          hits +
          '<div class="more">' +
          mis +
          str +
          mat +
          assess +
          links +
          "</div>" +
          '<div class="actions">' +
          '<button class="btn toggle" type="button" aria-expanded="' +
          open +
          '">' +
          (open ? "收合細節" : "展開細節") +
          "</button>" +
          (r.links && r.links.length
            ? '<a class="btn" href="' +
              esc(primaryLink(r.links)) +
              '" data-ex="' +
              esc(r.id) +
              '" target="_blank" rel="noopener">開啟全文</a>'
            : r.pdf && r.pdf.path
              ? '<a class="btn" href="' +
                esc(PDF_BASE + encodeURIComponent(r.pdf.path) + "?alt=media") +
                '" target="_blank" rel="noopener">開啟 PDF</a>'
              : "") +
          "</div>" +
          "</div></article>"
        );
      }

      function render() {
        const rows = filter();
        const list = document.getElementById("list");

        // 控制列狀態同步
        document
          .querySelectorAll("#scope .chip")
          .forEach((b) =>
            b.setAttribute("aria-pressed", String(b.dataset.v === S.scope)),
          );
        document
          .querySelectorAll("#grades .chip")
          .forEach((b) =>
            b.setAttribute(
              "aria-pressed",
              String(Number(b.dataset.v) === S.grade),
            ),
          );
        document
          .querySelectorAll("#themes .chip")
          .forEach((b) =>
            b.setAttribute("aria-pressed", String(S.themes.has(b.dataset.v))),
          );

        const pageHits = rows.reduce((s, r) => s + r.hits.length, 0);
        document.getElementById("tally").innerHTML =
          "<b>" +
          rows.length +
          "</b> / " +
          S.examples.length +
          " 筆" +
          (pageHits ? "　全文 <b>" + pageHits + "</b> 頁" : "") +
          (S.pagesLoading ? "　載入全文中…" : "");

        if (!rows.length) {
          list.innerHTML =
            '<div class="msg"><b>沒有符合的示例</b>' +
            "放寬主題篩選，或把搜尋範圍切到「全部」再試一次。</div>";
        } else {
          list.innerHTML = rows.map(card).join("");
        }
      }

      /* ══ 控制列 ════════════════════════════════════════ */
      function chip(label, value, cls) {
        return (
          '<button class="chip ' +
          (cls || "") +
          '" type="button" data-v="' +
          value +
          '" aria-pressed="false">' +
          label +
          "</button>"
        );
      }

      function setupControls() {
        document.getElementById("scope").innerHTML = SCOPES.map(([v, t]) =>
          chip(t, v),
        ).join("");
        document.getElementById("grades").innerHTML = [chip("全部", 0)]
          .concat([3, 4].map((g) => chip(GRADE_NAME[g], g)))
          .join("");
        document.getElementById("themes").innerHTML = THEME_LIST.map((t) =>
          chip(t, t, "theme"),
        ).join("");

        document.getElementById("scope").addEventListener("click", (e) => {
          const b = e.target.closest(".chip");
          if (!b) return;
          S.scope = b.dataset.v;
          if (needFull() && S.q) ensurePages();
          render();
        });

        document.getElementById("grades").addEventListener("click", (e) => {
          const b = e.target.closest(".chip");
          if (!b) return;
          S.grade = Number(b.dataset.v);
          render();
        });

        // 主題可複選；再點一次取消
        document.getElementById("themes").addEventListener("click", (e) => {
          const b = e.target.closest(".chip");
          if (!b) return;
          const v = b.dataset.v;
          S.themes.has(v) ? S.themes.delete(v) : S.themes.add(v);
          render();
        });

        const q = document.getElementById("q");
        let timer = null;
        q.addEventListener("input", () => {
          clearTimeout(timer);
          timer = setTimeout(() => {
            S.q = q.value.trim();
            if (needFull() && S.q) ensurePages();
            render();
          }, 140);
        });

        document.getElementById("clear").addEventListener("click", () => {
          q.value = "";
          S.q = "";
          q.focus();
          render();
        });

        // 字級切換：只改 --card-scale，卡片以外的版面不動
        const fs = document.getElementById("fontsize");
        fs.addEventListener("click", (e) => {
          const b = e.target.closest(".chip");
          if (!b) return;
          document.documentElement.style.setProperty(
            "--card-scale",
            b.dataset.scale,
          );
          // aria-pressed 與畫面狀態同步，螢幕閱讀器才讀得到目前選項
          fs.querySelectorAll(".chip").forEach((x) =>
            x.setAttribute("aria-pressed", String(x === b)),
          );
        });

        // 展開／收合以事件委派處理，重繪後不需要重新掛事件
        document.getElementById("list").addEventListener("click", (e) => {
          const b = e.target.closest(".toggle");
          if (!b) return;
          const id = b.closest(".card").dataset.id;
          S.open.has(id) ? S.open.delete(id) : S.open.add(id);
          render();
        });
      }

      /* ══ 啟動 ══════════════════════════════════════════ */
      (async function init() {
        setupControls();
        installLinkDelegation();
        try {
          const data = await loadData("examples.json", "__EXAMPLES__");
          S.examples = data.examples || [];
          S.meta = data.meta || {};
        } catch (e) {
          document.getElementById("list").innerHTML =
            '<div class="msg err"><b>examples.json 載不進來</b>' +
            "從 file:// 直接開啟時瀏覽器會擋掉本地讀取。改用本機伺服器（" +
            "<code>python -m http.server</code>），或執行 <code>build_data.py --js</code> " +
            '後解開 &lt;head&gt; 裡那兩行 script 註解。<br><span class="src">' +
            esc(e.message) +
            "</span></div>";
          return;
        }
        document.getElementById("foot").textContent =
          S.meta.count +
          " 筆示例／" +
